name: daily-refresh
on:
  schedule: [{cron: "30 0 * * *"}]   # 06:00 IST every day
  workflow_dispatch: {}
permissions: {contents: write, pages: write, id-token: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m jobpipe.pipeline
        env: {OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"}
      - name: Commit data (cache + jobs.json)
        run: |
          git config user.name "refresh-bot"; git config user.email "bot@users.noreply.github.com"
          git add data site/jobs.json; git diff --cached --quiet || git commit -m "daily refresh $(date -u +%F)"; git push
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
